<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('vertexcapitals_theme');
        if (theme === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
      } catch(e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>VertexCapitals — Transactions Ledger</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/d2685dbffe5d4b04.css">
  <link rel="stylesheet" href="css/theme-engine.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#183EFA',
            gold: '#F59E0B',
            dark: '#070A11',
            cardBg: '#0C121E',
            cardBorder: '#1E293B'
          }
        }
      }
    }
  </script>
  <script src="js/nav-fix.js"></script>
  <script src="js/app-store.js"></script>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#070A11] text-slate-900 dark:text-gray-100 min-h-screen flex flex-col font-sans antialiased selection:bg-primary selection:text-white transition-colors duration-300">
  
  <!-- Top Institutional Application Bar -->
  <header class="vx-glass-header sticky top-0 z-40 px-4 sm:px-8 py-3.5 flex justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <button onclick="VertexApp.toggleSideNav()" aria-label="Toggle Navigation" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-[#101726] border border-slate-200 dark:border-gray-800 hover:border-primary/50 flex items-center justify-center text-slate-700 dark:text-gray-300 hover:text-primary transition-all shadow-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <a href="dashboard.html" class="flex items-center gap-2">
        <img src="images/navbarlogo.svg" alt="VertexCapitals Logo" class="h-7 brand-logo-adaptive">
      </a>
      <span class="hidden sm:inline-block vx-badge vx-badge-primary">Audit Ledger</span>
    </div>

    <!-- Quick Workspace Navigation Pills -->
    <nav aria-label="Workspace Navigation" class="hidden lg:flex items-center gap-1 bg-slate-100/80 dark:bg-[#101726] p-1 rounded-xl border border-slate-200 dark:border-gray-800 text-xs font-bold">
      <a href="dashboard.html" class="vx-nav-link px-3.5 py-1.5 rounded-lg text-slate-600 dark:text-gray-300 hover:text-primary dark:hover:text-white transition-colors">Overview</a>
      <a href="invest-otc.html" class="vx-nav-link px-3.5 py-1.5 rounded-lg text-slate-600 dark:text-gray-300 hover:text-primary dark:hover:text-white transition-colors">Invest OTC</a>
      <a href="deposit.html" class="vx-nav-link px-3.5 py-1.5 rounded-lg text-slate-600 dark:text-gray-300 hover:text-primary dark:hover:text-white transition-colors">Deposit</a>
      <a href="withdrawal.html" class="vx-nav-link px-3.5 py-1.5 rounded-lg text-slate-600 dark:text-gray-300 hover:text-primary dark:hover:text-white transition-colors">Withdraw</a>
      <a href="transactions.html" aria-current="page" class="vx-nav-link px-3.5 py-1.5 rounded-lg font-bold">Ledger</a>
    </nav>

    <div class="flex items-center gap-2.5 sm:gap-3">
      <a href="dashboard.html" class="lg:hidden text-xs font-semibold text-slate-600 dark:text-gray-300 hover:text-primary px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-[#101726] border border-slate-200 dark:border-gray-800">Overview</a>
      <button onclick="VertexApp.toggleTheme()" class="theme-toggle-btn shadow-sm" title="Toggle Theme (Light / Dark Mode)" aria-label="Toggle color theme">
        <svg class="sun-icon w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon w-4 h-4 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button onclick="VertexApp.logout()" class="text-xs font-semibold text-slate-600 dark:text-gray-300 hover:text-rose-600 dark:hover:text-rose-400 px-3 py-2 bg-slate-100 dark:bg-[#101726] hover:bg-rose-50 dark:hover:bg-rose-500/10 border border-slate-200 dark:border-gray-800 hover:border-rose-300 dark:hover:border-rose-500/30 rounded-xl transition-all flex items-center gap-1.5" title="Sign Out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span class="hidden sm:inline">Logout</span>
      </button>
    </div>
  </header>

  <!-- Main Ledger Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <span class="vx-badge vx-badge-primary">Cryptographic Ledger</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-2 tracking-tight">Transactions History</h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-gray-400 mt-1">Live audit records of all crypto deposits, OTC returns, capital allocations, and payouts.</p>
      </div>

      <div class="flex gap-2.5">
        <a href="deposit.html" class="vx-btn-primary px-4 py-2.5 font-extrabold text-xs rounded-xl inline-flex items-center gap-1.5">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Deposit</span>
        </a>
        <a href="withdrawal.html" class="px-4 py-2.5 bg-white dark:bg-[#0c121e] hover:bg-slate-100 dark:hover:bg-gray-800 text-slate-700 dark:text-gray-200 border border-slate-200 dark:border-gray-800 font-bold text-xs rounded-xl transition-all inline-flex items-center gap-1.5 shadow-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
          <span>Withdraw</span>
        </a>
      </div>
    </div>

    <!-- Filter Buttons -->
    <div class="flex flex-wrap gap-2" role="group" aria-label="Filter transactions by category">
      <button onclick="filterTxs('all')" id="btn-filter-all" aria-pressed="true" class="vx-admin-pill active">All Records</button>
      <button onclick="filterTxs('deposit')" id="btn-filter-deposit" aria-pressed="false" class="vx-admin-pill">Deposits</button>
      <button onclick="filterTxs('withdrawal')" id="btn-filter-withdrawal" aria-pressed="false" class="vx-admin-pill">Withdrawals</button>
      <button onclick="filterTxs('otc_profit')" id="btn-filter-otc_profit" aria-pressed="false" class="vx-admin-pill">OTC Returns</button>
      <button onclick="filterTxs('invest_otc')" id="btn-filter-invest_otc" aria-pressed="false" class="vx-admin-pill">OTC Allocations</button>
    </div>

    <!-- Table -->
    <div class="vx-card overflow-hidden">
      <div class="vx-table-wrap" tabindex="0" role="region" aria-label="Transactions History">
        <table class="vx-table-responsive w-full text-left text-xs min-w-[680px]">
          <thead>
            <tr class="text-slate-500 dark:text-gray-400 uppercase tracking-wider border-b border-slate-200 dark:border-gray-800">
              <th class="py-4 px-6">Reference</th>
              <th class="py-4 px-6">Type</th>
              <th class="py-4 px-6">Asset</th>
              <th class="py-4 px-6">Amount</th>
              <th class="py-4 px-6">Status</th>
              <th class="py-4 px-6">Hash / Destination</th>
              <th class="py-4 px-6 text-right">Date</th>
            </tr>
          </thead>
          <tbody id="transactions-ledger-body" class="divide-y divide-slate-100 dark:divide-gray-800/60 font-medium">
            <tr class="vx-skeleton-row" aria-hidden="true">
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-20"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-24"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-16"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-20"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-16"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-32"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-20 ml-auto"></span></td>
            </tr>
            <tr class="vx-skeleton-row" aria-hidden="true">
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-20"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-24"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-16"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-20"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-16"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-32"></span></td>
              <td class="py-4 px-6"><span class="vx-skeleton vx-skeleton-line w-20 ml-auto"></span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let activeFilter = 'all';
    let allTransactions = [];

    function filterTxs(category) {
      activeFilter = category;
      ['all', 'deposit', 'withdrawal', 'otc_profit', 'invest_otc'].forEach(cat => {
        const btn = document.getElementById(`btn-filter-${cat}`);
        if (btn) {
          const isActive = cat === category;
          btn.className = isActive ? 'vx-admin-pill active' : 'vx-admin-pill';
          btn.setAttribute('aria-pressed', String(isActive));
        }
      });
      renderLedger();
    }

    async function initTransactions() {
      if (!VertexApp.currentUser) {
        window.location.href = 'login.html';
        return;
      }

      const tbody = document.getElementById('transactions-ledger-body');
      if (tbody && VertexApp.renderTableSkeleton) {
        tbody.innerHTML = VertexApp.renderTableSkeleton(4, 7);
      }

      const summary = await VertexApp.getSummary();
      if (summary && summary.transactions) {
        allTransactions = summary.transactions;
      }
      renderLedger();
    }

    function renderLedger() {
      const tbody = document.getElementById('transactions-ledger-body');
      let filtered = allTransactions;

      if (activeFilter !== 'all') {
        filtered = allTransactions.filter(t => {
          if (activeFilter === 'deposit') return t.type === 'deposit';
          if (activeFilter === 'withdrawal') return t.type === 'withdrawal';
          if (activeFilter === 'otc_profit') return t.type === 'otc_profit' || t.type === 'profit';
          if (activeFilter === 'invest_otc') return t.type === 'invest_otc' || t.type === 'investment' || t.type === 'otc_investment';
          return t.type === activeFilter;
        });
      }

      if (filtered.length === 0) {
        const emptyHtml = VertexApp.renderEmptyState
          ? VertexApp.renderEmptyState({
              title: 'No transactions recorded',
              description: 'No audit records match this category yet.',
              actionHtml: '<a href="deposit.html" class="vx-btn-primary px-4 py-2 text-xs rounded-xl">Make a Deposit</a>'
            })
          : 'No transactions recorded for this category.';
        tbody.innerHTML = `<tr class="vx-empty-row"><td colspan="7" class="p-6">${emptyHtml}</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(tx => {
        const isCredit = tx.type === 'deposit' || tx.type === 'otc_profit' || tx.type === 'profit';
        const amountPrefix = isCredit ? '+' : '-';
        const amountColor = isCredit ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400';
        
        let statusBadge = `<span class="vx-badge vx-badge-amber">Pending</span>`;
        if (tx.status === 'completed') {
          statusBadge = `<span class="vx-badge vx-badge-emerald">Completed</span>`;
        } else if (tx.status === 'rejected') {
          statusBadge = `<span class="vx-badge vx-badge-rose">Cancelled</span>`;
        }

        let typeLabel = (tx.type || 'Transaction').replace(/_/g, ' ');
        if (tx.type === 'invest_otc') typeLabel = 'OTC Allocation';
        if (tx.type === 'otc_profit') typeLabel = 'OTC Return';

        const dateStr = new Date(tx.created_at || Date.now()).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        return `
          <tr class="hover:bg-slate-50/80 dark:hover:bg-gray-800/30 transition-colors">
            <td data-label="Reference" class="py-4 px-6 font-bold text-slate-700 dark:text-gray-200">${tx.tx_ref}</td>
            <td data-label="Type" class="py-4 px-6 uppercase text-[11px] font-semibold text-primary">${typeLabel}</td>
            <td data-label="Asset" class="py-4 px-6 text-slate-600 dark:text-gray-300 font-medium">${tx.asset}</td>
            <td data-label="Amount" class="py-4 px-6 font-bold tabular-nums ${amountColor}">${amountPrefix}$${parseFloat(tx.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
            <td data-label="Status" class="py-4 px-6">${statusBadge}</td>
            <td data-label="Destination" class="py-4 px-6 text-[11px] text-slate-400 dark:text-gray-400 truncate max-w-xs">${tx.tx_hash || tx.destination_address || 'Internal'}</td>
            <td data-label="Date" class="py-4 px-6 text-right text-slate-400 dark:text-gray-400">${dateStr}</td>
          </tr>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', initTransactions);
  </script>
</body>
</html>
