<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PrimeHavenCapital — Admin Support Desk</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <!-- Theme Early Initializer to prevent flash of wrong theme (FOUC) -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('primehavencapital_theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/d2685dbffe5d4b04.css">
  <link rel="stylesheet" href="css/theme-engine.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#183EFA',
            gold: '#F59E0B',
            dark: '#0F172A',
            cardBg: '#1E293B',
            cardBorder: '#1E293B'
          }
        }
      }
    }
  </script>
  <script src="js/nav-fix.js"></script>
  <script src="js/app-store.js"></script>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#0F172A] text-slate-900 dark:text-gray-100 min-h-screen flex flex-col font-sans antialiased selection:bg-primary selection:text-white transition-colors duration-300">
  
  <!-- Header -->
  <header class="vx-glass-header px-4 sm:px-8 py-3.5 flex justify-between items-center sticky top-0 z-40 transition-colors">
    <div class="flex items-center gap-3">
      <a href="admin.html" class="flex items-center gap-2 text-slate-600 dark:text-gray-400 hover:text-primary dark:hover:text-white transition-colors font-semibold text-sm">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        <span>Back to Admin Panel</span>
      </a>
    </div>
    <div class="flex items-center gap-3">
      <!-- Theme Switcher Button -->
      <div class="vx-lang-switcher notranslate">
        <svg class="vx-lang-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="vx-lang-code">EN</span>
        <svg class="vx-lang-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        <select id="vx-lang-select" class="vx-lang-select" aria-label="Select Language" onchange="PrimeHavenTranslator.setLanguage(this.value)">
          <option value="en">EN · English</option>
          <option value="es">ES · Español</option>
          <option value="fr">FR · Français</option>
          <option value="de">DE · Deutsch</option>
          <option value="pt">PT · Português</option>
          <option value="ar">AR · العربية</option>
          <option value="zh-CN">ZH · 中文</option>
          <option value="ru">RU · Русский</option>
          <option value="ja">JA · 日本語</option>
          <option value="tr">TR · Türkçe</option>
        </select>
      </div>
      <button onclick="VertexApp.toggleTheme()" class="theme-toggle-btn shadow-sm" title="Toggle Theme (Light / Dark Mode)" aria-label="Toggle color theme">
        <svg class="sun-icon w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon w-4 h-4 text-slate-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>

      <span class="vx-badge vx-badge-primary">Support Desk</span>
    </div>
  </header>

  <!-- Chat Container -->
  <main class="flex-1 flex flex-col md:flex-row overflow-x-clip max-w-6xl w-full mx-auto p-4 sm:p-6 gap-6">
    
    <!-- Sidebar Active Investor Threads -->
    <div class="w-full md:w-80 vx-card flex flex-col overflow-hidden max-h-72 md:max-h-none">
      <div class="p-4 border-b border-slate-200 dark:border-gray-800/80 flex items-center justify-between">
        <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">Registered Client Threads</h3>
        <span id="admin-chat-count" class="vx-badge vx-badge-primary">0</span>
      </div>
      <div id="admin-chat-threads-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-gray-800/60 text-xs">
        <div class="p-4 space-y-2" aria-hidden="true">
          <div class="vx-skeleton vx-skeleton-line w-32"></div>
          <div class="vx-skeleton vx-skeleton-line w-48"></div>
        </div>
      </div>
    </div>

    <!-- Live Conversation Thread -->
    <div class="flex flex-1 min-h-[24rem] vx-card flex-col overflow-hidden">
      <!-- Chat Head -->
      <div class="p-4 bg-slate-50/80 dark:bg-[#172338] border-b border-slate-200 dark:border-gray-800/80 flex justify-between items-center gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <div id="chat-head-initials" class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-white font-bold text-xs shrink-0">VX</div>
          <div class="min-w-0">
            <h4 id="chat-head-name" class="font-bold text-slate-900 dark:text-white text-xs truncate">Select an investor account</h4>
            <p id="chat-head-meta" class="text-[10px] text-slate-500 dark:text-gray-400 font-semibold truncate">Requires active administrator session</p>
          </div>
        </div>
        <span id="chat-head-badge" class="vx-badge vx-badge-neutral shrink-0">Support Desk</span>
      </div>

      <!-- Messages / Account Activity Area -->
      <div class="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4 text-xs" id="chat-messages-container">
        <div class="vx-empty-state">
          <p class="vx-empty-title">Loading client correspondence desk</p>
          <p class="vx-empty-desc">Authenticate as administrator in Admin Center to inspect live client threads and dispatch Resend correspondence.</p>
        </div>
      </div>

      <!-- Input Bar -->
      <form onsubmit="handleSendReply(event)" class="p-4 bg-slate-50 dark:bg-gray-950/80 border-t border-slate-200 dark:border-gray-800 flex flex-col sm:flex-row gap-2">
        <label for="admin-chat-input" class="sr-only">Message to investor</label>
        <input type="text" id="admin-chat-input" placeholder="Send direct email message to selected investor..." class="vx-input flex-1 px-4 py-3 text-xs">
        <button type="submit" class="vx-btn-primary px-6 py-3 font-bold text-xs rounded-2xl">
          Send Dispatch
        </button>
      </form>
    </div>

  </main>

  <script>
    let chatUsers = [];
    let chatEmails = [];
    let chatTransactions = [];
    let selectedChatUser = null;

    async function initAdminChatDesk() {
      const token = VertexApp.getAdminToken ? VertexApp.getAdminToken() : null;
      const threadsEl = document.getElementById('admin-chat-threads-list');
      const container = document.getElementById('chat-messages-container');

      if (!token) {
        if (threadsEl) {
          threadsEl.innerHTML = `<div class="p-5 text-center space-y-2"><p class="font-bold text-slate-700 dark:text-gray-300">Admin Session Required</p><a href="admin.html" class="vx-btn-primary px-4 py-2 rounded-xl text-xs inline-flex">Sign In at Admin Desk</a></div>`;
        }
        return;
      }

      const data = await VertexApp.getAdminOverview();
      if (!data || !data.success) {
        if (threadsEl) threadsEl.innerHTML = `<div class="p-4 text-xs text-rose-500">Session expired or unauthorized. Please re-authenticate in Admin Center.</div>`;
        return;
      }

      chatUsers = (data.users || []).filter(u => u.role !== 'admin');
      chatEmails = data.emailLogs || [];
      chatTransactions = data.transactions || [];
      document.getElementById('admin-chat-count').innerText = chatUsers.length;

      if (chatUsers.length === 0) {
        threadsEl.innerHTML = `<div class="p-5 text-center text-slate-400">No registered investor accounts yet.</div>`;
        container.innerHTML = VertexApp.renderEmptyState({ title: 'No client threads', description: 'Client accounts will populate here automatically once registered.' });
        return;
      }

      selectInvestorThread(chatUsers[0].id);
    }

    function selectInvestorThread(userId) {
      selectedChatUser = chatUsers.find(u => u.id === userId) || chatUsers[0];
      renderThreadList();
      renderSelectedThread();
    }

    function renderThreadList() {
      const threadsEl = document.getElementById('admin-chat-threads-list');
      if (!threadsEl) return;
      threadsEl.innerHTML = chatUsers.map(u => {
        const isSelected = selectedChatUser && selectedChatUser.id === u.id;
        return `
          <button type="button" onclick="selectInvestorThread(${u.id})" class="w-full text-left p-4 transition-colors ${isSelected ? 'bg-primary/10 border-l-4 border-primary' : 'hover:bg-slate-50 dark:hover:bg-gray-800/50'}">
            <div class="flex justify-between items-center gap-2">
              <span class="font-bold text-slate-900 dark:text-white truncate">${u.full_name}</span>
              <span class="vx-badge ${u.status === 'active' ? 'vx-badge-emerald' : 'vx-badge-neutral'} shrink-0">${u.status || 'active'}</span>
            </div>
            <p class="text-slate-500 dark:text-gray-400 truncate mt-1">${u.email}</p>
          </button>
        `;
      }).join('');
    }

    function renderSelectedThread() {
      if (!selectedChatUser) return;
      const u = selectedChatUser;
      const initials = (u.full_name || 'VX').split(/\s+/).map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'VX';
      document.getElementById('chat-head-initials').innerText = initials;
      document.getElementById('chat-head-name').innerText = `${u.full_name} (${u.account_number || 'Acct #' + u.id})`;
      document.getElementById('chat-head-meta').innerText = `${u.email} • ${u.country || 'International'}`;
      const badge = document.getElementById('chat-head-badge');
      badge.className = u.kyc_status === 'verified' ? 'vx-badge vx-badge-emerald shrink-0' : 'vx-badge vx-badge-amber shrink-0';
      badge.innerText = u.kyc_status === 'verified' ? 'KYC Verified' : 'Standard Account';

      const container = document.getElementById('chat-messages-container');
      const userEmails = chatEmails.filter(e => (e.recipient_email || '').toLowerCase() === (u.email || '').toLowerCase());
      const userTxs = chatTransactions.filter(t => t.user_id === u.id).slice(0, 4);

      if (userEmails.length === 0 && userTxs.length === 0) {
        container.innerHTML = VertexApp.renderEmptyState({
          title: `No dispatches recorded for ${u.full_name}`,
          description: 'Send a direct correspondence update below using the Resend email gateway.'
        });
        return;
      }

      const itemsHtml = [
        ...userTxs.map(tx => `
          <div class="flex items-start gap-2.5">
            <div class="w-7 h-7 rounded-full bg-primary/15 text-primary flex items-center justify-center font-bold text-[10px] shrink-0">${initials}</div>
            <div class="bg-slate-100 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 p-3.5 rounded-2xl rounded-tl-none max-w-md text-slate-800 dark:text-gray-200 leading-relaxed shadow-sm">
              <span class="block text-[10px] uppercase font-bold text-primary mb-1">${tx.type} • ${tx.status}</span>
              Amount: $${parseFloat(tx.amount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })} (${tx.asset || 'USD'}) — Ref ${tx.tx_ref}
            </div>
          </div>
        `),
        ...userEmails.map(em => `
          <div class="flex items-start gap-2.5 justify-end">
            <div class="bg-primary text-white p-3.5 rounded-2xl rounded-tr-none max-w-md leading-relaxed shadow-lg shadow-blue-500/10">
              <span class="block text-[10px] uppercase font-bold text-blue-100 mb-1">${em.event_type || 'Admin Email'} • ${em.subject}</span>
              Dispatched to ${em.recipient_email} on ${new Date(em.created_at || Date.now()).toLocaleDateString()}
            </div>
            <div class="w-7 h-7 rounded-full bg-purple-600 flex items-center justify-center text-white font-bold text-[10px] shrink-0">AD</div>
          </div>
        `)
      ].join('');
      container.innerHTML = itemsHtml;
      container.scrollTop = container.scrollHeight;
    }

    async function handleSendReply(e) {
      e.preventDefault();
      const input = document.getElementById('admin-chat-input');
      const val = input.value.trim();
      if (!val) return;
      if (!selectedChatUser) {
        VertexApp.showToast('Please select a registered investor first.', 'error');
        return;
      }

      const res = await VertexApp.adminSendEmail(selectedChatUser.email, 'Support Desk Update — PrimeHavenCapital', val);
      if (!res || !res.success) {
        VertexApp.showToast((res && res.message) || 'Failed to dispatch message.', 'error');
        return;
      }

      const container = document.getElementById('chat-messages-container');
      const emptyBox = container.querySelector('.vx-empty-state');
      if (emptyBox) container.innerHTML = '';

      const div = document.createElement('div');
      div.className = 'flex items-start gap-2.5 justify-end';
      const bubble = document.createElement('div');
      bubble.className = 'bg-primary text-white p-3.5 rounded-2xl rounded-tr-none max-w-md leading-relaxed shadow-lg shadow-blue-500/10';
      bubble.textContent = val;
      const avatar = document.createElement('div');
      avatar.className = 'w-7 h-7 rounded-full bg-purple-600 flex items-center justify-center text-white font-bold text-[10px] shrink-0';
      avatar.textContent = 'AD';
      div.appendChild(bubble);
      div.appendChild(avatar);
      container.appendChild(div);
      input.value = '';
      container.scrollTop = container.scrollHeight;
    }

    document.addEventListener('DOMContentLoaded', initAdminChatDesk);
  </script>
