<svg xmlns="http://www.w3.org/2000/svg" width="340" height="56" viewBox="0 0 340 56" fill="none">
  <defs>
    <linearGradient id="phSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#183EFA" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="phHaven" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#183EFA" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="phCalm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="phGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#183EFA" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- PrimeHaven Sanctuary Shield & Arch Emblem -->
  <g transform="translate(8, 8)" filter="url(#phGlow)">
    <path d="M20 2 C29.5 2 37 8.5 37 18.5 C37 28.5 28.5 36.5 20 39 C11.5 36.5 3 28.5 3 18.5 C3 8.5 10.5 2 20 2 Z" fill="url(#phSky)" fill-opacity="0.12" stroke="url(#phSky)" stroke-width="2" />
    <path d="M11.5 29 V17.5 C11.5 12.8 15.3 9.5 20 9.5 C24.7 9.5 28.5 12.8 28.5 17.5 V29" stroke="url(#phHaven)" stroke-width="3.2" stroke-linecap="round" />
    <path d="M16.5 29 V19.5 C16.5 17.3 18.1 15.8 20 15.8 C21.9 15.8 23.5 17.3 23.5 19.5 V29" stroke="url(#phCalm)" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="20" cy="6.2" r="2.2" fill="#10B981" />
  </g>

  <!-- Calm Institutional Wordmark -->
  <text x="58" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20.5" font-weight="800" letter-spacing="-0.4" fill="#0F172A">PRIMEHAVEN<tspan dx="6" fill="#183EFA" font-weight="700">CAPITAL</tspan></text>
</svg>
