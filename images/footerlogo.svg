<svg xmlns="http://www.w3.org/2000/svg" width="360" height="72" viewBox="0 0 360 72" fill="none">
  <defs>
    <linearGradient id="phfSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#183EFA" />
    </linearGradient>
    <linearGradient id="phfLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="phfCalm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="phfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#3B82F6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- PrimeHaven Sanctuary Crest (Dark Surface Edition) -->
  <g transform="translate(8, 12)" filter="url(#phfGlow)">
    <path d="M22 2 C32.5 2 40.5 9.2 40.5 20.2 C40.5 31.2 31.2 40 22 43 C12.8 40 3.5 31.2 3.5 20.2 C3.5 9.2 11.5 2 22 2 Z" fill="url(#phfSky)" fill-opacity="0.16" stroke="url(#phfSky)" stroke-width="2.2" />
    <path d="M12.5 32 V19.5 C12.5 14 16.8 10.5 22 10.5 C27.2 10.5 31.5 14 31.5 19.5 V32" stroke="url(#phfLight)" stroke-width="3.4" stroke-linecap="round" />
    <path d="M18 32 V21.5 C18 19 19.8 17.5 22 17.5 C24.2 17.5 26 19 26 21.5 V32" stroke="url(#phfCalm)" stroke-width="3" stroke-linecap="round" />
    <circle cx="22" cy="6.8" r="2.3" fill="#34D399" />
  </g>

  <!-- Dark-Mode Wordmark -->
  <text x="62" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4" fill="#FFFFFF">PRIMEHAVEN<tspan dx="6" fill="#60A5FA" font-weight="700">CAPITAL</tspan></text>
  <text x="63" y="55" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.2" fill="#94A3B8">INSTITUTIONAL WEALTH &amp; CUSTODY</text>
</svg>
